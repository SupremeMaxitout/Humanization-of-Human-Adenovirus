# systems.conf — the systems to simulate.
#
# Format:  <system_name>  <pdb filename, relative to $TRIMER_DIR>
#
# Rules learned the hard way:
#   * Use SHORT, clean filenames. Names with ".cif" in the middle break tools
#     that sniff format from the extension.
#   * Structures must be MULTI-CHAIN (three chains for a homotrimer). The
#     single-chain form is for docking only.
#   * Every system in a comparison MUST be prepared identically — same force
#     field, same protocol. If you rebuild one, rebuild all. Mixed preparations
#     are a methods flaw a reviewer will find. See docs/LESSONS.md #6.
#
# The first entry is conventionally the wild-type reference.

wild_type   wild_type.pdb
fold_013    fold_013.pdb
fold_022    fold_022.pdb
fold_039    fold_039.pdb
fold_042    fold_042.pdb
fold_044    fold_044.pdb
